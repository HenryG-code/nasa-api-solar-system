name: Live site check

# Runs the suite against the deployed site every day (and on demand). If it
# fails, opens a GitHub issue, or comments on the open one, with a link to
# the run. When a later run passes, the issue is closed automatically.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    name: Playwright against the live site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests against the live site
        id: tests
        run: npm run test:live
        env:
          CI: "true"

      - name: Check the external APIs still answer
        id: contract
        if: ${{ !cancelled() }}
        run: npm run test:contract
        env:
          CI: "true"
          CONTRACT: "1"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report-live/
          retention-days: 14

      - name: Open or update an issue on failure
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.contract.outcome == 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = "live-site-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "d73a4a",
                description: "The daily live-site check failed",
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422: label already exists
            }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
            });

            const body = [
              `The scheduled Playwright run against the live site failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- The HTML report is attached to the run as **playwright-report-live**.`,
            ].join("\n");

            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: "Live site check is failing",
                body,
                labels: [label],
              });
            }

      - name: Close the failure issue once the site passes again
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "live-site-failure",
            });

            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Fixed: the live site check passed in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
